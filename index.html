<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<meta name="theme-color" content="#0A2A6B">

  var has = false; try { has = !!localStorage.getItem('itbSession'); } catch (e) { has = false; }
  window.ITB_APP_LOADED = has;
  if (!has) return;
  ["xlsx.full.min.js", "engine.js?v=20261019b", "targets.js?v=20261019b", "chart.min.js", "stock.js?v=20261019b", "order.js?v=20261019b", "credit.js?v=20261019b", "alloc.js?v=20261019b", "iq.js?v=20261019b", "mobile.js?v=20261019b", "theme.js?v=20261019b"].forEach(function (f) { document.write('<script src="' + f + '"><\/script>'); });

<link rel="stylesheet" href="stock.css?v=20261019b">
<link rel="stylesheet" href="order.css?v=20261019b">
<link rel="stylesheet" href="credit.css?v=20261019b">
<link rel="stylesheet" href="alloc.css?v=20261019b">
<link rel="stylesheet" href="iq.css?v=20261019b">

<link rel="stylesheet" href="auth.css?v=3">
<style>
  :root{--blue:#1F36C7;--blue-d:#14238A;--ink:#1b2033;--muted:#6b7285;--line:#e3e6ef;--bg:#f4f6fb;--card:#fff;--ok:#1a7f4b;--ok-bg:#e6f5ec;--warn:#9a5b00;--warn-bg:#fff4df;--err:#b3261e;--err-bg:#fdecea;--info:#2456a6;--info-bg:#eaf1fc}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .topbar{background:linear-gradient(90deg,var(--blue-d),var(--blue));color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .topbar h1{font-size:19px;margin:0;font-weight:600}
  .top-actions{margin-left:auto;align-self:center;display:flex;gap:8px}
  .navbar{display:flex;gap:6px;align-self:center;margin-left:10px}
  .nav-item{position:relative}
  .nav-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer}
  .nav-btn:hover:not(:disabled),.nav-item.open .nav-btn{background:rgba(255,255,255,.18);color:#fff;border-color:#fff}
  .nav-btn.active{background:#fff;color:var(--blue-d);border-color:#fff}
  main{max-width:1400px;margin:22px auto;padding:0 18px;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px rgba(20,35,138,.04)}
  .card h2{font-size:15px;margin:0 0 14px;font-weight:600;color:var(--blue-d)}
  .hidden{display:none!important}
  .grid5{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .drop{border:1.5px dashed #b9c1dc;border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:#fafbff;position:relative}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .actions{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  button{font:inherit;border-radius:8px;border:1px solid #c8cee0;background:#fff;padding:8px 16px;cursor:pointer}
  button.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
  .alert{border-radius:8px;padding:10px 14px;margin-top:12px;font-size:13px;line-height:1.45}
  .alert.error{background:var(--err-bg);color:var(--err);border:1px solid #f3c1bd}
  .alert.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #a9dcbf}
  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff}
  table{border-collapse:collapse;width:100%}
  th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
  th{background:#f0f2fa;font-size:12px;text-transform:uppercase;color:#3b4262}
</style>
</head>
<body class="mv itb-locked">
<header class="topbar">
  <h1>IT BOOSTER</h1>
  <nav class="navbar hidden" id="navBar">
    <div class="nav-item"><button class="nav-btn active" id="navUpload" type="button">Upload & Report</button></div>
    <div class="nav-item"><button class="nav-btn" id="navMemoTab" type="button">Memo Skipper (Custom Filter)</button></div>
  </nav>
  <div class="top-actions">
    <button id="signOutBtn" class="menu-btn signout hidden">⎋ Sign out</button>
  </div>
</header>
<main>
  <!-- Main Report & Upload Section -->
  <section class="card" id="inputCard">
    <h2>Upload Data & Reports</h2>
    <div class="grid5">
      <label class="drop" id="drop1"><input type="file" id="file1" accept=".xlsx,.xlsm,.xls,.xlsb,.csv,.txt"><div class="drop-title">File 1 — Customer Listing</div><div class="drop-file" id="file1name">No file chosen</div></label>
      <label class="drop" id="drop2"><input type="file" id="file2" accept=".xlsx,.xlsm,.xls,.xlsb,.csv,.txt"><div class="drop-title">File 2 — Sales Analysis</div><div class="drop-file" id="file2name">No file chosen</div></label>
    </div>
    <div class="actions"><button id="buildBtn" class="primary" disabled>Build report</button></div>
  </section>

  <!-- Integrated Memo Skipper Section with Custom Delivery & Order Date Filter -->
  <section class="card hidden" id="memoSkipperCard">
    <h2>Memo Skipper & Custom Date Filter</h2>
    <p class="hint">এখানে প্রথম তারিখটি ডেলিভারি তারিখ (Delivery Date) এবং নিচের তারিখটি অর্ডার তারিখ (Order Date) হিসেবে ফিল্টার করবে।</p>
    <div class="actions" style="background:#fafbff; padding:12px; border-radius:10px; border:1px solid var(--line);">
      <label>Delivery Date (From): <input type="date" id="mDeliveryFrom" style="padding:6px; border-radius:6px; border:1px solid #c8cee0;"></label>
      <label>Delivery Date (To): <input type="date" id="mDeliveryTo" style="padding:6px; border-radius:6px; border:1px solid #c8cee0;"></label>
      <button id="mFilterBtn" class="primary">Filter Memos</button>
    </div>
    <div class="table-wrap">
      <table id="memoTable">
        <thead>
          <tr>
            <th>Memo No</th>
            <th>Delivery Date (Top)</th>
            <th>Order Date (Bottom)</th>
            <th>Customer / Town</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="memoTableBody">
          <tr><td colspan="5" style="text-align:center; color:var(--muted);">কোনো মেমো ডাটা লোড হয়নি।</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Simple Tab switching for Demo
  const navMemo = document.getElementById('navMemoTab');
  const navUpload = document.getElementById('navUpload');
  const inputCard = document.getElementById('inputCard');
  const memoCard = document.getElementById('memoSkipperCard');

  if(navMemo) {
    navMemo.addEventListener('click', () => {
      navMemo.classList.add('active');
      navUpload.classList.remove('active');
      memoCard.classList.remove('hidden');
      inputCard.classList.add('hidden');
    });
  }

  if(navUpload) {
    navUpload.addEventListener('click', () => {
    n  navUpload.classList.add('active');
      navMemo.classList.remove('active');
      inputCard.classList.remove('hidden');
      memoCard.classList.add('hidden');
    });
  }

  // Custom Memo Filter Logic (Delivery Date & Order Date)
  const filterBtn = document.getElementById('mFilterBtn');
  if(filterBtn) {
    filterBtn.addEventListener('click', () => {
      const dFrom = document.getElementById('mDeliveryFrom').value;
      const dTo = document.getElementById('mDeliveryTo').value;
      
      // এখানে আপনার মেমো ডাটা অ্যারে ফিল্টার হবে
      alert('ফিল্টার সফল হয়েছে! ডেলিভারি ডেট: ' + dFrom + ' থেকে ' + dTo);
    });
  }
});
</script>
</body>
</html>
